<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK 狗大户奖金池转入监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --card-hover: #212433;
    --border: #2a2d3a;
    --text: #e4e6f0;
    --text-secondary: #8b8fa3;
    --accent: #f7931a;
    --green: #22c55e;
    --blue: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .container { max-width: 1400px; margin: 0 auto; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 20px; font-size: 12px; flex-wrap: wrap; gap: 8px;
  }
  .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-bar .dot.online { background: #22c55e; }
  .status-bar .dot.offline { background: #ef4444; }

  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    flex-wrap: wrap; gap: 16px;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header h1 span { background: linear-gradient(135deg, var(--accent), #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  .add-addr-box {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .add-addr-box input {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px;
    font-family: monospace; font-size: 12px; width: 360px; max-width: 100%;
    outline: none;
  }
  .add-addr-box input:focus { border-color: var(--accent); }
  .add-addr-box button {
    background: var(--accent); color: #000; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-size: 13px;
  }
  .add-addr-box button:hover { opacity: 0.85; }
  .add-addr-box button:disabled { opacity: 0.4; cursor: not-allowed; }
  .add-addr-box .msg { font-size: 12px; color: var(--text-secondary); }

  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .summary-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  .summary-card .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .summary-card .value { font-size: 24px; font-weight: 700; margin: 6px 0; }
  .summary-card .detail { font-size: 12px; color: var(--text-secondary); }

  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  @media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .chart-container h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

  .recent-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 28px; }
  .recent-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

  .whale-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .whale-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; cursor: pointer;
    background: linear-gradient(135deg, var(--card), var(--card-hover));
    border-bottom: 1px solid var(--border);
  }
  .whale-header:hover { background: var(--card-hover); }
  .whale-header .left { display: flex; align-items: center; gap: 12px; }
  .whale-header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(247,147,26,0.15);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--accent);
  }
  .whale-header .addr { font-family: monospace; font-size: 13px; word-break: break-all; }
  .whale-header .stats { display: flex; gap: 20px; }
  .whale-header .stat { text-align: center; }
  .whale-header .stat .num { font-weight: 700; font-size: 16px; }
  .whale-header .stat .lbl { font-size: 11px; color: var(--text-secondary); }
  .whale-header .arrow { color: var(--text-secondary); font-size: 18px; transition: transform 0.2s; }
  .whale-header.collapsed .arrow { transform: rotate(-90deg); }
  .whale-header .fetching { font-size: 11px; color: var(--accent); }
  .whale-body { padding: 20px; }
  .whale-body.hidden { display: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .tx-hash { font-family: monospace; font-size: 12px; }
  .tx-hash a { color: var(--blue); text-decoration: none; }
  .tx-hash a:hover { text-decoration: underline; }
  .amount { font-weight: 600; color: var(--green); }
  .timestamp { font-size: 12px; color: var(--text-secondary); }

  .footer { text-align: center; padding: 24px 0; font-size: 12px; color: var(--text-secondary); }
  .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="status-bar">
    <div><span class="dot" id="statusDot"></span> <span id="statusText">加载中...</span></div>
    <div id="recordInfo">-</div>
    <div id="updateTime">-</div>
  </div>

  <div class="header">
    <div>
      <h1>🏴 <span>ARK 奖金池 → 狗大户</span> 转入监控</h1>
      <div class="subtitle">
        代币: <code style="font-size:11px;color:var(--accent);">0xCae117ca6Bc8A341D2E7207F30E180f0e5618B9D</code>
        &nbsp;·&nbsp; 奖金池: <code style="font-size:11px;color:var(--accent);">0x8501...5BD4</code>
      </div>
    </div>
    <div class="add-addr-box">
      <input type="text" id="addrInput" placeholder="输入狗大户地址 0x..." spellcheck="false">
      <button id="addBtn" onclick="addAddress()">➕ 添加监控</button>
      <span id="addMsg" class="msg"></span>
    </div>
  </div>

  <div id="loadingScreen" class="loading">
    <div class="spinner"></div>
    <div>正在加载数据...</div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="chart-row">
      <div class="chart-container"><h3>📊 各地址累计接收 ARK</h3><canvas id="chartTotal"></canvas></div>
      <div class="chart-container"><h3>📈 每日转入趋势</h3><canvas id="chartTimeline"></canvas></div>
    </div>
    <div class="recent-box">
      <h3>🕐 最近转入 <span style="font-size:12px;font-weight:400;color:var(--text-secondary);" id="recentCount"></span></h3>
      <div id="recentTable"></div>
    </div>
    <h2 style="font-size:17px;font-weight:600;margin:24px 0 16px;">📋 各地址详细记录</h2>
    <div id="whaleDetails"></div>
  </div>

  <div class="footer">数据来源: BSCScan · 自动更新: 每5分钟</div>
</div>

<script>
const BSC_URL = 'https://bscscan.com';
function txLink(h) { return BSC_URL + '/tx/' + h; }
function addrLink(a) { return BSC_URL + '/address/' + a; }
function shortAddr(a) { return a.slice(0,10) + '...' + a.slice(-6); }
function fmt(v) { return parseFloat(v).toLocaleString(undefined, {maximumFractionDigits:4}); }

let transfers = [];
let whaleStats = {};
let charts = {};

function getWhaleData(addr) {
  return transfers.filter(t => t.to.toLowerCase() === addr.toLowerCase() && t.txHash !== 'placeholder');
}

async function loadData() {
  try {
    const resp = await fetch('/api/transfers');
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    transfers = data.transfers || [];
    whaleStats = data.whaleStats || {};
    
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('statusDot').className = 'dot online';
    document.getElementById('statusText').textContent = '已连接';
    render(data);
  } catch(e) {
    document.getElementById('statusDot').className = 'dot offline';
    document.getElementById('statusText').textContent = '加载失败: ' + e.message;
    setTimeout(loadData, 30000);
  }
}

function render(data) {
  const now = new Date();
  document.getElementById('updateTime').textContent = '更新: ' + now.toLocaleString('zh-CN');
  document.getElementById('recordInfo').textContent = `数据: ${data.totalCount || 0} 条 | 监控: ${Object.keys(whaleStats).length} 个地址`;
  renderSummary();
  renderCharts();
  renderRecent();
  renderWhaleDetails();
}

function renderSummary() {
  const realTransfers = transfers.filter(t => t.txHash !== 'placeholder');
  const totalAmount = realTransfers.reduce((s, t) => s + parseFloat(t.value), 0);
  const addrCount = Object.keys(whaleStats).length;
  const latest = realTransfers.length > 0 ? realTransfers[0].timestamp.slice(0,16).replace('T',' ') : '-';
  document.getElementById('summaryGrid').innerHTML = [
    { label: '监控地址', value: addrCount, detail: '狗大户' },
    { label: '总转入笔数', value: realTransfers.length, detail: '从奖金池转入' },
    { label: '总转入 ARK', value: totalAmount.toLocaleString(undefined, {maximumFractionDigits:2}), detail: '' },
    { label: '最近转入', value: latest, detail: '最新一笔' },
  ].map(c => `<div class="summary-card"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="detail">${c.detail}</div></div>`).join('');
}

function renderCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  const realTransfers = transfers.filter(t => t.txHash !== 'placeholder');
  
  const addrs = Object.keys(whaleStats);
  const labels = addrs.map(shortAddr);
  const totals = addrs.map(a => whaleStats[a]?.total || 0);
  
  charts.total = new Chart(document.getElementById('chartTotal'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'ARK 累计', data: totals, backgroundColor: '#f7931a88', borderColor: '#f7931a', borderWidth: 1.5, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { labels: { color: '#8b8fa3' } } }, scales: { x: { ticks: { color: '#8b8fa3', maxRotation: 45 } }, y: { ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a44' } } } }
  });
  
  const dailyMap = {};
  realTransfers.forEach(t => { const d = t.timestamp.slice(0,10); dailyMap[d] = (dailyMap[d] || 0) + parseFloat(t.value); });
  const days = Object.keys(dailyMap).sort();
  const amounts = days.map(d => dailyMap[d]);
  
  charts.timeline = new Chart(document.getElementById('chartTimeline'), {
    type: 'line',
    data: { labels: days, datasets: [{ label: 'ARK 转入量', data: amounts, borderColor: '#22c55e', backgroundColor: '#22c55e22', fill: true, tension: 0.3, pointBackgroundColor: '#22c55e', pointRadius: 2 }] },
    options: { responsive: true, plugins: { legend: { labels: { color: '#8b8fa3' } } }, scales: { x: { ticks: { color: '#8b8fa3' } }, y: { ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a44' } } } }
  });
}

function renderRecent() {
  const realTransfers = transfers.filter(t => t.txHash !== 'placeholder');
  const recent = [...realTransfers].sort((a, b) => b.timestamp.localeCompare(a.timestamp)).slice(0, 20);
  document.getElementById('recentCount').textContent = '(最近 20 笔)';
  document.getElementById('recentTable').innerHTML =
    '<table><thead><tr><th>时间</th><th>Tx Hash</th><th>接收地址</th><th>数量(ARK)</th></tr></thead><tbody>' +
    recent.map(t => `<tr><td class="timestamp">${t.timestamp.slice(0,16).replace('T',' ')}</td><td class="tx-hash"><a href="${txLink(t.txHash)}" target="_blank">${t.txHash.slice(0,16)}...</a></td><td class="tx-hash"><a href="${addrLink(t.to)}" target="_blank">${shortAddr(t.to)}</a></td><td class="amount">${fmt(t.value)}</td></tr>`).join('') +
    '</tbody></table>';
}

function renderWhaleDetails() {
  const addrs = [...new Set(transfers.map(t => t.to))];
  const container = document.getElementById('whaleDetails');
  
  container.innerHTML = addrs.map((addr, idx) => {
    const records = getWhaleData(addr).sort((a, b) => b.timestamp.localeCompare(a.timestamp));
    const st = whaleStats[addr] || { count: 0, total: 0 };
    const isPlaceholder = transfers.some(t => t.to.toLowerCase() === addr && t.txHash === 'placeholder');
    
    const rows = records.map(t => `<tr><td class="timestamp">${t.timestamp.slice(0,16).replace('T',' ')}</td><td class="tx-hash"><a href="${txLink(t.txHash)}" target="_blank">${t.txHash.slice(0,16)}...</a></td><td class="amount">${fmt(t.value)}</td></tr>`).join('');
    const collapsed = idx > 0 ? ' collapsed' : '';
    const hidden = idx > 0 ? ' hidden' : '';
    
    return `<div class="whale-card"><div class="whale-header${collapsed}" onclick="this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('hidden')"><div class="left"><div class="avatar">#${idx + 1}</div><div><div class="addr">${addr}</div>${isPlaceholder ? '<span class="fetching">🔍 正在爬取BSCScan...</span>' : ''}</div></div><div class="stats"><div class="stat"><div class="num">${st.count || 0}</div><div class="lbl">笔数</div></div><div class="stat"><div class="num" style="color:var(--green)">${fmt(st.total || 0)}</div><div class="lbl">ARK</div></div></div><div class="arrow">▼</div></div><div class="whale-body${hidden}">${isPlaceholder ? '<div style="color:var(--accent);text-align:center;padding:20px;">🔍 正在从BSCScan爬取转入记录...</div>' : (records.length === 0 ? '<div style="color:var(--text-secondary);text-align:center;padding:20px;">暂无从奖金池转入的记录</div>' : '<table><thead><tr><th>时间</th><th>Tx Hash</th><th>数量(ARK)</th></tr></thead><tbody>' + rows + '</tbody></table>')}</div></div>`;
  }).join('');
}

async function addAddress() {
  const input = document.getElementById('addrInput');
  const btn = document.getElementById('addBtn');
  const msg = document.getElementById('addMsg');
  const addr = input.value.trim();
  
  if (!addr || !/^0x[a-fA-F0-9]{40}$/.test(addr)) {
    msg.textContent = '请输入有效的地址 (0x...)';
    return;
  }
  
  btn.disabled = true;
  msg.textContent = '正在添加...';
  
  try {
    // 1. 先添加到列表
    const resp1 = await fetch(`/api/transfers?action=add&address=${addr}`);
    const data1 = await resp1.json();
    
    if (data1.message === '地址已存在') {
      msg.textContent = '⚠️ 该地址已在监控中';
      btn.disabled = false;
      return;
    }
    
    msg.textContent = '✅ 已添加, 正在爬取BSCScan数据...';
    
    // 2. 触发爬取
    await fetch(`/api/transfers?action=fetch&address=${addr}`);
    
    // 3. 每3秒刷新一次等数据回来
    let retry = 0;
    const checkData = setInterval(async () => {
      retry++;
      await loadData();
      const hasData = transfers.some(t => t.to.toLowerCase() === addr && t.txHash !== 'placeholder');
      if (hasData || retry > 20) {
        clearInterval(checkData);
        if (hasData) {
          msg.textContent = `✅ 完成! 共 ${transfers.filter(t => t.to.toLowerCase() === addr && t.txHash !== 'placeholder').length} 条记录`;
        } else {
          msg.textContent = '⚠️ 未找到从奖金池转入的记录';
        }
        btn.disabled = false;
        setTimeout(() => { msg.textContent = ''; }, 5000);
      }
    }, 3000);
    
    input.value = '';
    
  } catch(e) {
    msg.textContent = '❌ 失败: ' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('addrInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addAddress();
});

loadData();
setInterval(loadData, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadData();
});
</script>
</body>
</html>
